name: Release to Maven Central

on:
  # Tag push release: git tag v1.0.2 && git push origin v1.0.2
  # The tagged commit must be reachable from main.
  push:
    tags: ['v*']
  # Manual trigger: Actions tab -> Run workflow (run it from the main branch).
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 1.0.2 (empty = use the version in pom.xml)'
        required: false
        type: string

# Least privilege by default; the publish job raises contents to write
# only so it can create the tag and the GitHub Release.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Requires a "release" environment with required reviewers configured in repository settings.
    environment: release
    permissions:
      contents: write
    env:
      # Untrusted input: only ever read through the environment, never interpolated into scripts.
      INPUT_VERSION: ${{ inputs.version }}
      VERSIONS_PLUGIN: org.codehaus.mojo:versions-maven-plugin:2.18.0
      HELP_PLUGIN: org.apache.maven.plugins:maven-help-plugin:3.5.2
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history so the main-ancestry check below can work.
          fetch-depth: 0

      - name: Resolve and validate release version
        id: ver
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            VERSION="$INPUT_VERSION"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # Maven is preinstalled on GitHub-hosted runners; Java is configured after these checks.
            VERSION="$(mvn -B -q "${HELP_PLUGIN}:evaluate" -Dexpression=project.version -DforceStdout)"
          fi
          # Match the WHOLE string with bash's [[ =~ ]] (grep would match line by line and
          # accept multi-line input such as $'1.0.0\nvalue=9.9.9'). Newlines are rejected explicitly too.
          VERSION_RE='^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'
          if [[ "$VERSION" == *$'\n'* || "$VERSION" == *$'\r'* || ! "$VERSION" =~ $VERSION_RE ]]; then
            echo "::error::Invalid release version. Expected X.Y.Z or X.Y.Z-qualifier."
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: Require the release commit to be on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Commit $GITHUB_SHA is not reachable from main. Releases are only built from main."
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      # Tag pushes are never rewritten: the pom must already carry the tagged version (checked below).
      # Manual dispatch with an explicit version may set it, as before.
      - name: Set pom version for manual dispatch
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.value }}
        run: |
          set -euo pipefail
          CURRENT="$(mvn -B -q "${HELP_PLUGIN}:evaluate" -Dexpression=project.version -DforceStdout)"
          if [ "$CURRENT" != "$RELEASE_VERSION" ]; then
            echo "Setting pom version $CURRENT -> $RELEASE_VERSION"
            mvn -B "${VERSIONS_PLUGIN}:set" -DnewVersion="$RELEASE_VERSION" -DgenerateBackupPoms=false --no-transfer-progress
          fi

      - name: Verify pom version equals release version
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.value }}
        run: |
          set -euo pipefail
          POM_VERSION="$(mvn -B -q "${HELP_PLUGIN}:evaluate" -Dexpression=project.version -DforceStdout)"
          if [ "$POM_VERSION" != "$RELEASE_VERSION" ]; then
            echo "::error::pom.xml version ($POM_VERSION) does not match release version ($RELEASE_VERSION)."
            exit 1
          fi

      # Tests run exactly once, here; the deploy step below skips them.
      - name: Verify
        run: mvn -B verify --no-transfer-progress

      - name: Deploy to Maven Central
        run: mvn -B deploy -Prelease -DskipTests --no-transfer-progress
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.ver.outputs.value }}
        run: |
          set -euo pipefail
          TAG="v${RELEASE_VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; nothing to create."
          else
            # --target pins the new tag (if it does not exist yet) to the verified commit.
            gh release create "$TAG" --target "$GITHUB_SHA" --title "TestFly ${RELEASE_VERSION}" --generate-notes
          fi
