```yaml
name: TestFly CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: testfly-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Framework unit tests
  # ─────────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout framework
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Run unit tests
        run: mvn test --no-transfer-progress

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            **/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish unit test results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Unit Test Results
          path: '**/target/surefire-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Framework integration tests
  #
  # These tests use real external backends.
  # The job itself always starts, but the test command is skipped when the
  # required API key is not configured.
  # ─────────────────────────────────────────────────────────────────────────────
  framework-integration-tests:
    name: Framework Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout framework
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Run real backend integration tests
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          REPORTPORTAL_API_KEY: ${{ secrets.REPORTPORTAL_API_KEY }}
          REPORTPORTAL_ENDPOINT: ${{ secrets.REPORTPORTAL_ENDPOINT }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "DEEPSEEK_API_KEY is not configured."
            echo "Skipping real backend integration tests."
            exit 0
          fi

          echo "DEEPSEEK_API_KEY is configured."
          echo "Running real backend integration tests..."

          mvn verify \
            -Preal-backends \
            --no-transfer-progress

      - name: Upload Failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framework-integration-test-results
          path: |
            **/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish integration test results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Framework Integration Test Results
          path: '**/target/failsafe-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: Consumer integration tests
  #
  # Builds the current framework, installs it locally, pins the consumer project
  # to the current version, then runs API-focused consumer tests.
  # ─────────────────────────────────────────────────────────────────────────────
  integration-tests:
    name: Consumer Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout framework
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Install framework to local Maven repository
        run: |
          mvn install \
            -DskipTests \
            -Dgpg.skip=true \
            --no-transfer-progress

      - name: Get framework version
        id: version
        shell: bash
        run: |
          VERSION=$(mvn help:evaluate \
            -Dexpression=project.version \
            -q \
            -DforceStdout)

          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Framework version: $VERSION"

      - name: Checkout consumer test project
        uses: actions/checkout@v4
        with:
          repository: testfly/testfly-test
          path: testfly-test

      - name: Pin consumer project to current framework version
        shell: bash
        env:
          FRAMEWORK_VERSION: ${{ steps.version.outputs.value }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          pom = Path("testfly-test/pom.xml")
          text = pom.read_text()

          version = os.environ["FRAMEWORK_VERSION"]

          pattern = (
              r"(<artifactId>\s*testfly\s*</artifactId>\s*"
              r"<version>)(.*?)(</version>)"
          )

          updated, count = re.subn(
              pattern,
              rf"\g<1>{version}\g<3>",
              text,
              count=1,
              flags=re.DOTALL,
          )

          if count == 0:
              raise SystemExit(
                  "Could not find io.testfly:testfly dependency in testfly-test/pom.xml"
              )

          pom.write_text(updated)
          print(f"Pinned consumer project to TestFly {version}")
          PY

      - name: Run consumer API tests
        working-directory: testfly-test
        env:
          CI: true
        run: |
          mvn test \
            -Dtest="ApiDemoTest,ApiSchemaDemoTest" \
            -DskipITs \
            --no-transfer-progress

      - name: Upload consumer test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consumer-test-results
          path: |
            testfly-test/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish consumer test results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Consumer Test Results
          path: 'testfly-test/target/surefire-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false
```
