name: TestFly CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Run unit tests
        run: mvn test --no-transfer-progress

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: '**/target/surefire-reports/'
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish unit test results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Unit Test Results
          path: '**/target/surefire-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

  framework-integration-tests:
    name: Framework Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Run real backend tests
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          REPORTPORTAL_API_KEY: ${{ secrets.REPORTPORTAL_API_KEY }}
          REPORTPORTAL_ENDPOINT: ${{ secrets.REPORTPORTAL_ENDPOINT }}
        run: |
          if [ -z "$AI_API_KEY" ]; then
            echo "AI_API_KEY is not configured."
            echo "Skipping real backend tests."
            exit 0
          fi

          mvn verify -Preal-backends --no-transfer-progress

      - name: Upload Failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framework-integration-test-results
          path: '**/target/failsafe-reports/'
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish integration test results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Framework Integration Test Results
          path: '**/target/failsafe-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

  integration-tests:
    name: Consumer Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout framework
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Install framework
        run: mvn install -DskipTests -Dgpg.skip=true --no-transfer-progress

      - name: Get framework version
        id: version
        run: |
          VERSION=$(mvn help:evaluate \
            -Dexpression=project.version \
            -q \
            -DforceStdout)

          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Framework version: $VERSION"

      - name: Checkout consumer project
        uses: actions/checkout@v4
        with:
          repository: testfly/testfly-test
          path: testfly-test

      - name: Update consumer project version
        working-directory: testfly-test
        env:
          FRAMEWORK_VERSION: ${{ steps.version.outputs.value }}
        run: |
          mvn versions:use-dep-version \
            -Dincludes=io.testfly:testfly \
            -DdepVersion="$FRAMEWORK_VERSION" \
            -DforceVersion=true \
            -DgenerateBackupPoms=false

      - name: Run consumer API tests
        working-directory: testfly-test
        env:
          CI: 'true'
        run: |
          mvn test \
            -Dtest=ApiDemoTest,ApiSchemaDemoTest \
            -DskipITs \
            --no-transfer-progress

      - name: Upload consumer test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consumer-test-results
          path: 'testfly-test/target/surefire-reports/'
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish consumer test results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Consumer Test Results
          path: 'testfly-test/target/surefire-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false