# Profile for IosLoginExampleTest (native iOS login on an app that is already installed on the simulator).
# Run:
#   MOBILE_DEVICE_ID=<udid> MOBILE_LOGIN_USER=<member id> MOBILE_LOGIN_PASSWORD=<password> \
#     mvn test -Dtest=IosLoginExampleTest   (selects this profile itself)
# mobilecli is started automatically when its server is down (mobile.autoStartServer); install the mobilecli agent on the simulator once.
# Credentials come from the environment only; never commit them.

mobile:
  serverUrl: ${MOBILECLI_URL:-http://localhost:12000}
  platform: ios
  deviceId: ${MOBILE_DEVICE_ID:-}
  app:
    bundleId: ${MOBILE_APP_BUNDLE_ID:-com.nesine.new-bet-dev}
    reset: clearData
  alerts: dismiss               # closes the tracking prompt that clearData brings back
  timeouts:
    actionMs: 30000
    pollMs: 500
    rpcMs: 60000
