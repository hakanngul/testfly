# Profile for the native mobile examples (src/test/java/io/testfly/examples/mobile).
# Run: mvn test -Dtestfly.profile=mobile-ios -Dtest=IosSettingsExampleTest
# mobilecli's server is started automatically when it is down; needs one booted iOS simulator with the mobilecli agent installed.

mobile:
  serverUrl: ${MOBILECLI_URL:-http://localhost:12000}
  platform: ios
  deviceId: ${MOBILE_DEVICE_ID:-}
  app:
    bundleId: com.apple.Preferences        # the built-in Settings app: no app file needed
    reset: relaunch
  timeouts:
    actionMs: 30000            # simulators and emulators are slow right after a launch
    pollMs: 500
    rpcMs: 60000
