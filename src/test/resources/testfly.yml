browser:
  name: chrome
  headless: true
  arguments:
    - --start-maximized
    - --disable-notifications
    - --remote-allow-origins=*
  capabilities:
    acceptInsecureCerts: true
    pageLoadStrategy: eager

execution:
  mode: local
  baseUrl: https://www.saucedemo.com/
  gridUrl: http://localhost:4444/wd/hub
#  parallel: none/methods/classes
  parallel: methods
  threadCount: 4
  maxActiveSessions: 4

api:
  baseUrl: https://fakeapi.net
  timeoutSeconds: 30
  logBody: false

retry:
  enabled: true
  maxAttempts: 2

timeouts:
  explicit: 10
  pageLoad: 30

reporting:
  allureEnabled: true
  reportPortal:
    enabled: true
    endpoint: https://reportportal.starlettech.tech
    apiKey: mobile_o5IMKqyCTm6EPJtn6Q4Jrc7GtURTOQoUSHGFkmdlmPh0mmea4JwgTA7PddZo4sfY
    project: demo-web
    launch: "Demo Web- DEV"
    description: "My awesome launch"
    attributes: "env:dev"
    mode: default