browser:
  name: chrome
  headless: true
  arguments:
    - --start-maximized
    - --disable-notifications
    - --remote-allow-origins=*
  capabilities:
    acceptInsecureCerts: true
    pageLoadStrategy: eager

execution:
  mode: local
  baseUrl: https://www.saucedemo.com/
  gridUrl: http://localhost:4444/wd/hub
#  parallel: none/methods/classes
  parallel: methods
  threadCount: 4
  maxActiveSessions: 4

api:
  baseUrl: https://fakeapi.net
  timeoutSeconds: 30
  logBody: false

retry:
  enabled: true
  maxAttempts: 2

timeouts:
  explicit: 10
  pageLoad: 30