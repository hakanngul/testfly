browser:
  name: chrome
  headless: true
  arguments:
    - --start-maximized
    - --disable-notifications
    - --remote-allow-origins=*
  capabilities:
    acceptInsecureCerts: true
    pageLoadStrategy: normal

execution:
  mode: local
  baseUrl: https://www.saucedemo.com/
  gridUrl: http://localhost:4444/wd/hub
  #gridUrl: https://selenium-grid.dev34.buckedbet.com
#  parallel: none/methods/classes
  parallel: methods
  threadCount: 4
  maxActiveSessions: 4

api:
  baseUrl: https://fakeapi.net
  timeoutSeconds: 30
  logBody: false

retry:
  enabled: false
  maxAttempts: 2

timeouts:
  explicit: 10
  pageLoad: 30

reporting:
  allureEnabled: true
  reportPortal:
    enabled: true
    endpoint: ${REPORTPORTAL_ENDPOINT:-https://reportportal.example.com}
    apiKey: ${REPORTPORTAL_API_KEY}
    project: demo-web
    launch: "Demo Web - Dev"
    description: "Automated test execution powered by TestFly"
    attributes: "env:dev"
    type: auto
    mode: default

locators:
  selfHealing: true

ai:
  failureAnalysis: true
  provider: openai-compatible
  baseUrl: https://api.deepseek.com
  apiKey: ${AI_API_KEY}
  model: deepseek-v4-flash
  language: tr
  timeoutSeconds: 20