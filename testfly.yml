# TestFly Configuration
# Documentation: https://testfly.dev/docs/configuration

execution:
  mode: local
  baseUrl: https://www.saucedemo.com

api:
  baseUrl: https://fakeapi.net
  timeoutSeconds: 30
  logBody: false

browser:
  name: chrome
  headless: false
  lifecycle: per-test

timeouts:
  explicit: 10
  pageLoad: 30

retry:
  enabled: true
  maxAttempts: 2

ai:
  provider: openai-compatible
  baseUrl: https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
  model: qwen3.8-flash
  apiKey: ${AI_API_KEY}
  timeoutSeconds: 30
  actionCache: true

reporting:
  screenshotOnFailure: true
  htmlReport: true

# Native mobile (incubating): uncomment to drive Android/iOS apps through mobilecli.
# Better kept in a profile, e.g. src/test/resources/testfly-myapp-ios.yml (-Dtestfly.profile=myapp-ios).
# Docs: https://testfly.dev/docs/mobile/getting-started
# mobile:
#   platform: ios                     # android | ios
#   deviceId: ${MOBILE_DEVICE_ID:-}   # AVD name / serial / simulator UDID
#   app:
#     bundleId: com.example.app       # iOS bundle id / Android package
#     reset: relaunch                 # none | relaunch | clearData
#   autoStartServer: true             # start mobilecli when it is not running
